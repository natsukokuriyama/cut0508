<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>動画確認用カット表作成ツール v8.2 (Gemini API)</title>
    <style>
        :root { --primary: #2c3e50; --accent: #e74c3c; --bg: #f0f2f5; }
        body { font-family: 'Helvetica Neue', Arial, sans-serif; background: var(--bg); margin: 0; padding: 20px; color: #333; }
        .container { max-width: 1300px; margin: 0 auto; }
        header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; border-bottom: 2px solid #ddd; padding-bottom: 10px; }
        h1 { margin: 0; color: var(--primary); font-size: 1.4rem; }
        .settings-section { background: #1a73e8; color: white; padding: 15px; border-radius: 8px; margin-bottom: 20px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); }
        .settings-section input { width: 100%; padding: 10px; border-radius: 4px; border: none; margin-top: 10px; box-sizing: border-box; }
        .upload-section { background: white; padding: 15px; border-radius: 8px; margin-bottom: 20px; }
        .main-layout { display: grid; grid-template-columns: 450px 1fr; gap: 20px; align-items: start; }
        .video-sticky { position: sticky; top: 20px; background: white; padding: 15px; border-radius: 8px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); }
        video { width: 100%; border-radius: 4px; background: #000; }
        .controls { margin-top: 15px; display: flex; flex-direction: column; gap: 10px; }
        button { padding: 12px; cursor: pointer; border: none; border-radius: 6px; font-weight: bold; }
        .btn-cap { background: var(--accent); color: white; }
        .btn-xlsx { background: #27ae60; color: white; }
        .btn-pptx { background: #d35400; color: white; }
        table { width: 100%; border-collapse: collapse; background: white; border-radius: 8px; overflow: hidden; }
        th { background: var(--primary); color: white; padding: 12px; text-align: left; }
        td { border-bottom: 1px solid #eee; padding: 10px; }
        .thumb-wrap canvas { width: 180px; height: auto; border-radius: 4px; background: #000; }
        textarea { width: 100%; height: 60px; border: 1px solid #ddd; border-radius: 4px; padding: 8px; margin-bottom: 5px; }
        .ocr-loading { background-color: #f0f7ff; color: #1a73e8; font-weight: bold; animation: pulse 1.5s infinite; }
        @keyframes pulse { 0% { opacity: 0.6; } 50% { opacity: 1; } 100% { opacity: 0.6; } }
        #status { font-size: 0.85rem; font-weight: bold; margin-top: 10px; text-align: center; padding: 8px; border-radius: 4px; }
        .status-success { background: #27ae60; color: white; }
    </style>
</head>
<body>

<div class="container">
    <header>
        <h1>🎬 動画確認用カット表作成ツール <span style="font-size: 0.8rem; color: #7f8c8d;">v8.2 (Gemini API 最終安定版)</span></h1>
    </header>
    
    <div class="settings-section">
        <label style="font-weight: bold;">🔑 Gemini APIキー</label>
        <input type="password" id="apiKey" placeholder="AIza..." onchange="saveApiKey()">
        <p style="font-size: 0.8rem; margin-top: 5px;">※Google AI Studioで取得した無料キーを入力してください。</p>
    </div>

    <div class="upload-section">
        <input type="file" id="videoFile" accept="video/mp4,video/x-m4v,video/*">
    </div>

    <div class="main-layout">
        <div class="video-sticky">
            <video id="player" controls playsinline muted preload="auto"></video>
            <div id="status">動画を選択してください</div>
            <div class="controls">
                <button class="btn-cap" onclick="captureFrame()">📸 シーンをカット登録</button>
                <button class="btn-xlsx" onclick="exportToExcel()">Excel 📥</button>
                <button class="btn-pptx" onclick="exportToPPTX()">PowerPoint 📥</button>
            </div>
        </div>

        <div class="list-section">
            <table id="cutTable" style="display:none;">
                <thead>
                    <tr>
                        <th style="width: 50px;">No.</th>
                        <th style="width: 100px;">タイム</th>
                        <th style="width: 200px;">画像</th>
                        <th>セリフ / テロップ</th>
                        <th>操作</th>
                    </tr>
                </thead>
                <tbody id="tableBody"></tbody>
            </table>
        </div>
    </div>
</div>

<canvas id="hiddenCanvas" style="display:none;"></canvas>

<script>
    window.onload = () => {
        const savedKey = localStorage.getItem('gemini_api_key');
        if(savedKey) document.getElementById('apiKey').value = savedKey;
    };

    function saveApiKey() {
        localStorage.setItem('gemini_api_key', document.getElementById('apiKey').value.trim());
    }

    const video = document.getElementById('player');
    const tableBody = document.getElementById('tableBody');
    const cutTable = document.getElementById('cutTable');
    const statusEl = document.getElementById('status');
    const canvas = document.getElementById('hiddenCanvas');
    const ctx = canvas.getContext('2d');
    let cutData = [];
    let currentObjectUrl = null;

    document.getElementById('videoFile').addEventListener('change', function(e) {
        const file = e.target.files[0];
        if (!file) return;
        if (currentObjectUrl) URL.revokeObjectURL(currentObjectUrl);
        currentObjectUrl = URL.createObjectURL(file);
        video.src = currentObjectUrl;
        video.load();
    });

    video.addEventListener('canplay', () => {
        statusEl.className = "status-success";
        statusEl.innerText = "✅ 準備完了";
    });

    function captureFrame() {
        if (!video.src) return;
        cutTable.style.display = 'table';
        canvas.width = video.videoWidth;
        canvas.height = video.videoHeight;
        ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
        
        const fullImgData = canvas.toDataURL('image/jpeg', 0.8);
        const id = Date.now();
        const apiKey = document.getElementById('apiKey').value.trim();

        const newItem = {
            id: id, time: formatTime(video.currentTime), dialogue: "", 
            telop: apiKey ? "✨ AIが解析中..." : "", 
            img: fullImgData, aspectRatio: video.videoHeight / video.videoWidth,
            isOcrRunning: !!apiKey 
        };
        
        cutData.push(newItem);
        renderTable();
        if (apiKey) runGeminiAI(id, fullImgData, apiKey);
    }

    async function runGeminiAI(id, base64Image, apiKey) {
        try {
            const imageData = base64Image.split(',')[1];
            // 確実に動く v1beta / gemini-1.5-flash を使用
            const url = `https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash:generateContent?key=${apiKey}`;

            const response = await fetch(url, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    contents: [{ parts: [{ text: "画像内の文字を抽出して" }, { inline_data: { mime_type: "image/jpeg", data: imageData } }] }]
                })
            });

            const data = await response.json();
            const text = data.candidates[0].content.parts[0].text.trim();
            const item = cutData.find(d => d.id === id);
            if (item) {
                item.telop = text;
                item.isOcrRunning = false;
                renderTable();
            }
        } catch (err) {
            console.error(err);
            const item = cutData.find(d => d.id === id);
            if (item) {
                item.telop = "⚠️ エラー (コンソールを確認)";
                item.isOcrRunning = false;
                renderTable();
            }
        }
    }

    function renderTable() {
        tableBody.innerHTML = "";
        cutData.forEach((item, index) => {
            const row = document.createElement('tr');
            row.innerHTML = `
                <td>${index + 1}</td>
                <td>${item.time}</td>
                <td><canvas id="thumb-${item.id}"></canvas></td>
                <td>
                    <textarea placeholder="セリフ" oninput="updateText(${item.id}, 'dialogue', this.value)">${item.dialogue}</textarea>
                    <textarea class="${item.isOcrRunning ? 'ocr-loading' : ''}" placeholder="テロップ" oninput="updateText(${item.id}, 'telop', this.value)">${item.telop}</textarea>
                </td>
                <td><button onclick="del(${item.id})">削除</button></td>
            `;
            tableBody.appendChild(row);
            const tCanvas = document.getElementById(`thumb-${item.id}`);
            const tCtx = tCanvas.getContext('2d');
            const img = new Image();
            img.onload = () => { tCanvas.width = 180; tCanvas.height = 180 * item.aspectRatio; tCtx.drawImage(img, 0, 0, 180, 180 * item.aspectRatio); };
            img.src = item.img;
        });
    }

    function del(id) { cutData = cutData.filter(d => d.id !== id); renderTable(); }
    function updateText(id, field, val) { const itm = cutData.find(d => d.id === id); if (itm) itm[field] = val; }
    function formatTime(sec) {
        const m = Math.floor(sec / 60); const s = Math.floor(sec % 60);
        return `${String(m).padStart(2,'0')}:${String(s).padStart(2,'0')}`;
    }

    async function exportToExcel() { alert("ExcelJSを読み込んでください"); }
    async function exportToPPTX() { alert("PptxGenJSを読み込んでください"); }
</script>

</body>
</html>
